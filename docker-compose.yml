version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: renuka_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-renuka_chai}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - renuka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d renuka_chai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - renuka_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: renuka_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/renuka_chai
      SECRET_KEY: ${SECRET_KEY:-renuka-chai-super-secret-production-key-2026}
      PROJECT_NAME: "Renuka Chai Centre API"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - renuka_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: renuka_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - renuka_net

volumes:
  renuka_postgres_data:
    driver: local

networks:
  renuka_net:
    driver: bridge
